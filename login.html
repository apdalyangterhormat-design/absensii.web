<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WorkAttend - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(99,102,241,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(139,92,246,.22),
            transparent 35%
        ),
        #0f172a;

    overflow:hidden;

}


/* BACKGROUND GRID */

.grid{

    position:fixed;

    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    pointer-events:none;

}


/* LOGIN WRAPPER */

.login-wrapper{

    position:relative;

    z-index:2;

    width:390px;

}


/* TOP BRAND */

.brand{

    text-align:center;

    margin-bottom:22px;

}

.logo{

    width:58px;
    height:58px;

    margin:0 auto 12px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    color:white;

    font-size:27px;

    box-shadow:
        0 12px 35px rgba(99,102,241,.35);

}

.brand h1{

    color:white;

    font-size:23px;

    letter-spacing:.3px;

}

.brand p{

    color:#94a3b8;

    font-size:10px;

    margin-top:5px;

    letter-spacing:1.5px;

}


/* LOGIN BOX */

.login-box{

    padding:32px;

    border-radius:24px;

    background:
        rgba(255,255,255,.96);

    box-shadow:
        0 30px 80px rgba(0,0,0,.4);

}


/* TITLE */

.login-title{

    margin-bottom:25px;

}

.login-title .label{

    color:#6366f1;

    font-size:9px;

    font-weight:bold;

    letter-spacing:1.5px;

    margin-bottom:7px;

}

.login-title h2{

    color:#111827;

    font-size:25px;

}

.login-title p{

    color:#64748b;

    font-size:11px;

    margin-top:5px;

}


/* ERROR */

.error{

    display:none;

    padding:10px 12px;

    margin-bottom:15px;

    border-radius:9px;

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#dc2626;

    font-size:10px;

}


/* FORM */

.form-group{

    margin-bottom:17px;

}

label{

    display:block;

    margin-bottom:7px;

    color:#475569;

    font-size:10px;

    font-weight:bold;

    letter-spacing:.5px;

}

.input{

    position:relative;

}

.input-icon{

    position:absolute;

    left:14px;

    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

    font-size:14px;

}

input{

    width:100%;

    height:46px;

    border-radius:11px;

    border:1px solid #e2e8f0;

    background:#f8fafc;

    outline:none;

    padding:0 42px;

    color:#1e293b;

    font-size:12px;

    transition:.2s;

}

input:focus{

    background:white;

    border-color:#6366f1;

    box-shadow:
        0 0 0 4px rgba(99,102,241,.08);

}


/* PASSWORD EYE */

.eye{

    position:absolute;

    right:13px;

    top:50%;

    transform:translateY(-50%);

    color:#64748b;

    cursor:pointer;

    font-size:14px;

}


/* BUTTON */

.login-btn{

    width:100%;

    height:47px;

    margin-top:5px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    color:white;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 9px 22px rgba(99,102,241,.25);

}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 13px 28px rgba(99,102,241,.35);

}

.login-btn:active{

    transform:translateY(0);

}


/* BOTTOM */

.bottom{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:19px;

    color:#94a3b8;

    font-size:9px;

}

.security{

    display:flex;

    align-items:center;

    gap:5px;

}


/* CLOCK */

.clock{

    text-align:right;

}

#time{

    color:#475569;

    font-weight:bold;

    font-size:10px;

}

#date{

    margin-top:2px;

    font-size:8px;

}


/* FOOTER */

.footer{

    text-align:center;

    color:#64748b;

    font-size:9px;

    margin-top:18px;

}


/* MOBILE */

@media(max-width:450px){

    .login-wrapper{

        width:90%;

    }

    .login-box{

        padding:26px 22px;

    }

}

</style>

</head>

<body>


<div class="grid"></div>


<div class="login-wrapper">


    <!-- BRAND -->

    <div class="brand">

        <div class="logo">
            ✓
        </div>

        <h1>
            WorkAttend
        </h1>

        <p>
            WORK MANAGEMENT SYSTEM
        </p>

    </div>


    <!-- LOGIN -->

    <div class="login-box">


        <div class="login-title">

            <div class="label">
                MEMBER ACCESS
            </div>

            <h2>
                Selamat datang 👋
            </h2>

            <p>
                Silakan masuk untuk mengakses sistem.
            </p>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            id="error">

            ⚠ Username atau password salah.

        </div>


        <!-- USERNAME -->

        <div class="form-group">

            <label>
                USERNAME
            </label>

            <div class="input">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="off">

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                PASSWORD
            </label>

            <div class="input">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password">

                <span
                    class="eye"
                    id="eye"
                    onclick="togglePassword()">

                    👁

                </span>

            </div>

        </div>


        <!-- BUTTON -->

        <button
            class="login-btn"
            onclick="login()">

            Masuk ke Dashboard →

        </button>


        <!-- BOTTOM -->

        <div class="bottom">

            <div class="security">

                🔐 Sistem internal

            </div>

            <div class="clock">

                <div id="time">
                    00:00:00
                </div>

                <div id="date">
                    -
                </div>

            </div>

        </div>


    </div>


    <div class="footer">

        WorkAttend © 2026

    </div>


</div>


<script>


/* =========================
   LOGIN
========================= */

function login(){

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const error =
        document.getElementById("error");


    /* AKUN LOGIN */

    const usernameBenar = "admin";

    const passwordBenar = "12345";


    if(
        username === usernameBenar &&
        password === passwordBenar
    ){

        error.style.display = "none";


        localStorage.setItem(
            "sudahLogin",
            "true"
        );


        window.location.href =
            "bew.html";

    }

    else{

        error.style.display = "block";

    }

}


/* =========================
   PASSWORD
========================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");


    if(password.type === "password"){

        password.type = "text";

        eye.textContent = "🙈";

    }

    else{

        password.type = "password";

        eye.textContent = "👁";

    }

}


/* =========================
   ENTER
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =========================
   CLOCK
========================= */

function updateClock(){

    const now =
        new Date();


    document.getElementById("time")
        .textContent =
        now.toLocaleTimeString(
            "id-ID"
        );


    document.getElementById("date")
        .textContent =
        now.toLocaleDateString(
            "id-ID",
            {
                weekday:"short",
                day:"numeric",
                month:"short",
                year:"numeric"
            }
        );

}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================
   AUTO FOCUS
========================= */

document
    .getElementById("username")
    .focus();

</script>

</body>
</html>
